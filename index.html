<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cattle Lead Tracker – Paraguay</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#f3efe6; --surface:#fffdf8; --surface2:#ebe5d7; --text:#25231d; --muted:#7a7467;
  --line:#ddd5c4; --accent:#1f5c4a; --accent2:#c0653a; --accent-text:#ffffff;
  --danger:#b03a2e; --warn:#b2761a; --ok:#2f7d52; --shadow:0 1px 2px rgba(60,45,20,.08);
  --serif:Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#101617; --surface:#182123; --surface2:#202b2d; --text:#ebe8df; --muted:#8f9d99;
    --line:#2b3a3c; --accent:#5cc0a0; --accent2:#e58f5f; --accent-text:#0a1b15;
    --danger:#ff8f82; --warn:#e8b34a; --ok:#6fcf97; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101617; --surface:#182123; --surface2:#202b2d; --text:#ebe8df; --muted:#8f9d99;
  --line:#2b3a3c; --accent:#5cc0a0; --accent2:#e58f5f; --accent-text:#0a1b15;
  --danger:#ff8f82; --warn:#e8b34a; --ok:#6fcf97; --shadow:none;
}
.st-new{--c:#8b93a1}.st-contacted{--c:#3f88b5}.st-replied{--c:#2f9e8f}.st-meeting{--c:#d1a132}
.st-verifying{--c:#cf6f3f}.st-offer{--c:#8e63c4}.st-closed{--c:#3b9a5a}.st-lost{--c:#a85b52}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,summary,.serif{font-family:var(--serif)}
.wrap{max-width:1560px;margin:0 auto;padding:14px}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:22px;margin:0;letter-spacing:.2px}
h1 small{font-family:system-ui,sans-serif;font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.badge.warn{color:var(--warn)}

input,select,textarea,button{font:inherit;color:var(--text)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0;border-color:var(--accent)}
textarea{min-height:74px;resize:vertical}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button.primary:hover{filter:brightness(1.06)}
button.warn2{background:var(--accent2);color:#fff;border-color:var(--accent2);font-weight:600}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px;letter-spacing:.2px}

.app{display:grid;grid-template-columns:430px minmax(0,1fr);gap:16px;align-items:start}

/* sidebar */
.side{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;
  position:sticky;top:12px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);box-shadow:var(--shadow);overflow:hidden}
.side-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--surface2),var(--surface))}
.side-head h2{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.side-head .sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:var(--muted)}
.meter .bar{flex:1;height:7px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .2s}
.side-body{overflow-y:auto;padding:4px 14px 8px;flex:1}
details{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--bg)}
summary{cursor:pointer;padding:9px 12px;font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";margin-right:7px;color:var(--accent2);font-size:12px;transition:transform .15s;display:inline-block}
details[open]>summary::before{transform:rotate(90deg)}
summary .t{flex:1}
summary .cnt{font-family:system-ui,sans-serif;font-size:11px;font-weight:500;color:var(--muted);background:var(--surface2);border-radius:99px;padding:1px 8px}
details[open]>summary{border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:11px 12px 13px}
.grid .full{grid-column:1/-1}
.pad{padding:11px 12px 13px}
.side-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.side-foot .row{display:flex;gap:8px;flex-wrap:wrap}
.side-foot .spacer{flex:1}
#formMsg{font-size:12.5px;color:var(--warn);margin-bottom:7px;min-height:0}
#formMsg:empty{display:none}
.logrow{padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.logadd{display:grid;grid-template-columns:100px 1fr auto;gap:7px;margin-top:9px}
#sideClose{display:none}

/* main */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 13px;box-shadow:var(--shadow);border-left:4px solid var(--accent)}
.stat:nth-child(even){border-left-color:var(--accent2)}
.stat b{display:block;font-family:var(--serif);font-size:23px;line-height:1.15}
.stat span{font-size:11.5px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.toolbar input,.toolbar select{width:auto;min-width:120px}
.toolbar input#q{flex:1 1 200px}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:10px;border:1px solid var(--line)}
.tabs button{border:none;background:transparent;padding:6px 12px;border-radius:7px}
.tabs button.on{background:var(--accent);color:var(--accent-text);font-weight:600}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 250px;background:var(--surface2);border-radius:12px;padding:8px;border-top:4px solid var(--c)}
.col h3{font-family:var(--serif);font-size:13.5px;margin:3px 5px 8px;display:flex;justify-content:space-between;gap:6px}
.col h3 span{font-family:system-ui,sans-serif;color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:9px;padding:9px 10px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.card:hover{border-color:var(--muted);border-left-color:var(--c)}
.card.sel{outline:2px solid var(--accent2);outline-offset:1px}
.c-top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.small{font-size:12.3px}
.muted{color:var(--muted)}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.pct{font-size:11px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.due{color:var(--warn);font-weight:600}
.over{color:var(--danger);font-weight:600}
.c-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px}
.mv button{padding:0 8px;font-size:12px;border-radius:6px}
.wa{font-size:12px;color:var(--accent);text-decoration:none;font-weight:700}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--surface2)}
tr[data-open]{cursor:pointer}
tr[data-open]:hover td{background:var(--surface2)}
tr.sel td{background:var(--surface2)}
.sec{margin:0 0 18px}
.sec h2{font-size:16px;margin:0 0 8px}
.list .card{max-width:620px}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--text);color:var(--bg);
  padding:9px 14px;border-radius:8px;font-size:13.5px;z-index:40;display:none;max-width:90%}

#imp{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 14px);overflow-y:auto;z-index:50}
#imp[hidden]{display:none}
.impbox{background:var(--bg);border:1px solid var(--line);border-radius:14px;width:100%;max-width:780px;padding:16px;box-shadow:var(--shadow)}
.impbox h2{margin:0 0 6px;font-size:19px}
.impsum{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.impsum span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12.5px}
.impsum .good{border-color:var(--ok);color:var(--ok)}
.impsum .bad{border-color:var(--danger);color:var(--danger)}
.impsum .meh{border-color:var(--warn);color:var(--warn)}
.issues{max-height:170px;overflow-y:auto;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}
.issues div{padding:2px 0}
.impbox table{min-width:0;font-size:12.5px}
.impbox .tablewrap{max-height:230px;overflow:auto}
/* dashboard */
:root{--k1:#1f7a5c;--k2:#c0653a;--k3:#3f88b5;--k4:#d1a132;--k5:#8e63c4;--k6:#a85b52;--k7:#6b8f3a;--k8:#8b93a1}
.app.is-dash{grid-template-columns:1fr}
.app.is-dash #side,.app.is-dash #mainPipe{display:none}
#dash[hidden]{display:none}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.dgrid .s2{grid-column:span 2}
.dgrid .s3{grid-column:1/-1}
.hb{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:8px;align-items:center;margin:6px 0;font-size:12.5px}
.hb[data-gostage],.hb[data-godept],.hb[data-gosource]{cursor:pointer}
.hb[data-gostage]:hover .t,.hb[data-godept]:hover .t,.hb[data-gosource]:hover .t{color:var(--accent2);text-decoration:underline}
.hb .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bar{height:15px;background:var(--surface2);border-radius:8px;overflow:hidden}
.hb .bar i{display:block;height:100%;border-radius:8px;background:var(--c,var(--accent))}
.hb .v{color:var(--muted);white-space:nowrap;font-size:12px}
.donutwrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.donut{width:118px;height:118px;color:var(--text);flex:none}
.legend{flex:1;min-width:130px;font-size:12.5px}
.lg{display:flex;gap:7px;align-items:center;margin:4px 0}
.lg[data-gosource]{cursor:pointer}
.lg i{width:11px;height:11px;border-radius:3px;flex:none}
.lg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg b{font-weight:600;color:var(--muted);font-size:12px;white-space:nowrap}
.vc{display:flex;gap:7px;align-items:flex-end}
.vc .col2{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.vc .n{font-size:11.5px;color:var(--muted);margin-bottom:3px;height:15px}
.vc .area{height:118px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.vc .b{width:100%;max-width:44px;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:7px 7px 0 0}
.vc .l{font-size:10.5px;color:var(--muted);margin-top:5px;white-space:nowrap}
.att{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.att:hover strong{color:var(--accent2)}
.att .why{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.chip{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.chip.r{border-color:var(--danger);color:var(--danger)}
.chip.w{border-color:var(--warn);color:var(--warn)}
.dtable{width:100%;min-width:0;font-size:13px}
.dtable tr[data-open]{cursor:pointer}
@media (max-width:1100px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.dgrid{grid-template-columns:1fr}.dgrid .s2{grid-column:auto}.hb{grid-template-columns:100px minmax(0,1fr) auto}}
/* lead profile page */
.app.is-profile{grid-template-columns:1fr}
.app.is-profile #side,.app.is-profile #mainPipe{display:none}
#profile[hidden]{display:none}
.pf-top{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.pf-top .spacer{flex:1}
.pf-hero{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.pf-hero h2{font-size:26px;margin:0 0 2px}
.pf-hero .sub{color:var(--muted);font-size:14px}
.pf-pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pf-pills .pill{font-size:12px;padding:2px 10px}
.pf-pills .stg{background:var(--c);color:#fff;border-color:var(--c);font-weight:600}
.pf-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pf-actions a{text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--text);background:var(--surface2)}
.pf-actions a:hover{border-color:var(--accent)}
.stepper{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
.step{flex:1;min-width:92px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);font-size:11.5px;text-align:center;background:var(--surface2);color:var(--muted)}
.step.done{background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--text);border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.step.cur{background:var(--c);color:#fff;font-weight:700;border-color:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow)}
.tile:nth-child(even){border-left-color:var(--accent2)}
.tile b{display:block;font-family:var(--serif);font-size:20px;line-height:1.2}
.tile span{font-size:11.5px;color:var(--muted)}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start}
.pf-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.pf-card h3{font-family:var(--serif);font-size:16px;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pf-card h3 small{font-family:system-ui,sans-serif;font-size:12px;font-weight:400;color:var(--muted)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word;white-space:pre-wrap}
.kv a{color:var(--accent)}
.nextbox{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:9px 12px;margin-bottom:10px;background:var(--bg)}
.nextbox.over{border-left-color:var(--danger)}
.nextbox.due{border-left-color:var(--warn)}
.fu-form{display:grid;grid-template-columns:1fr 150px auto;gap:8px;margin-top:6px}
.fu-form.two{grid-template-columns:130px 1fr auto}
.fu-form.st{grid-template-columns:1fr auto}
.sepl{border:none;border-top:1px dashed var(--line);margin:12px 0}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl .it{position:relative;padding:0 0 12px;font-size:13.5px}
.tl .it::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent2);border:2px solid var(--surface)}
.tl .it.first::before{background:var(--muted)}
.chk{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.chk i{font-style:normal;font-weight:700;width:18px;text-align:center}
.chk .okc{color:var(--ok)}.chk .noc{color:var(--danger)}
.score{font-family:var(--serif);font-size:30px;line-height:1}
.missing{font-size:12.5px;color:var(--muted);margin-top:8px}
@media (max-width:520px){.fu-form,.fu-form.two,.fu-form.st{grid-template-columns:1fr}.kv{grid-template-columns:120px minmax(0,1fr)}}
@media (max-width:1100px){.app{grid-template-columns:380px minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0;z-index:30;max-height:none;border-radius:0;display:none;
    padding-top:env(safe-area-inset-top,0px)}
  .side.open{display:flex}
  #sideClose{display:inline-block}
}
@media (max-width:520px){.grid{grid-template-columns:1fr}.logadd{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>🐄 Cattle Lead Tracker<small>Paraguay</small></h1>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <div class="tabs" id="navTabs"><button data-nav="dash" class="on">Dashboard</button><button data-nav="pipeline">Pipeline</button></div>
      <span class="badge" id="modeBadge">Loading…</span>
      <button id="btnTpl" title="Download the Excel template">Excel template</button>
      <button id="btnImp" title="Import farmers from Excel or CSV">Import Excel</button>
      <input type="file" id="impFile" accept=".xlsx,.xls,.csv" hidden>
      <button id="btnExport">Export CSV</button>
      <button class="warn2" id="btnAdd">+ New farmer</button>
    </div>
  </div>

  <div class="app is-dash">
    <aside class="side" id="side">
      <div class="side-head">
        <h2><span id="formTitle">New farmer</span><span style="display:flex;gap:6px"><button id="btnViewProfile" hidden>View profile</button><button id="sideClose">Close ✕</button></span></h2>
        <div class="sub" id="formSub">Fill in what you know. Everything can be completed later.</div>
        <div class="meter"><div class="bar"><i id="meterBar"></i></div><span id="meterTxt">0% complete</span></div>
      </div>
      <div class="side-body" id="formBody"></div>
      <div class="side-foot">
        <div id="formMsg"></div>
        <div class="row">
          <button class="primary" id="btnSave">Save</button>
          <button id="btnSaveNew">Save &amp; new</button>
          <span class="spacer"></span>
          <button class="danger" id="btnDel" hidden>Delete</button>
        </div>
      </div>
    </aside>

    <main id="mainPipe">
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <div class="tabs" id="tabs">
          <button data-view="board" class="on">Board</button>
          <button data-view="list">List</button>
          <button data-view="follow">Follow-ups</button>
        </div>
        <input id="q" type="search" placeholder="Search name, ID, company, farm, phone…">
        <select id="fStage"></select>
        <select id="fDept"></select>
        <select id="fSource"></select>
        <button id="fClear" title="Clear all filters">Clear</button>
      </div>
      <div id="content"></div>
    </main>

    <section id="dash"></section>

    <section id="profile" hidden></section>
  </div>
</div>
<div id="imp" hidden></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

var STAGES=[
  {k:'new',l:'New lead'},
  {k:'contacted',l:'Contacted'},
  {k:'replied',l:'Replied'},

/* Fields that count toward the profile-completeness score used for underwriting readiness. */
var KEYS=['name','ci','phone','farm','dept','district','area','herd','tenure','titleStatus','senacsa','brand','guiaPagada','pledge','history','creditHistory'];

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){return (Number(n)||0).toLocaleString('en-US');}
function num(v){var n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:0;}
function clone(o){return JSON.parse(JSON.stringify(o));}
function digits(s){return String(s||'').replace(/\D/g,'');}
function today(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function stageLabel(k){for(var i=0;i<STAGES.length;i++){if(STAGES[i].k===k)return STAGES[i].l;}return k;}
function isActive(f){return f.stage!=='closed'&&f.stage!=='lost';}
function lastContact(f){var l=f.log||[];return l.length?l[l.length-1].d:'';}
function filled(v){return v!=null&&v!==''&&v!==0&&v!=='Unknown'&&v!=='Undecided';}
/* Collateral score: 5 reproducible checks. Each is true only when the evidence is recorded. */
var COLL_TOTAL=5;
function collChecks(f){
  return [
    {ok:f.guiaPagada==='Provided & checked'||f.guiaPagada==='Born on the farm',l:'Ownership proof (guía pagada)',v:f.guiaPagada},
    {ok:f.cota==='Valid',l:'COTA valid',v:f.cota},
    {ok:f.brand==='Yes',l:'Registered brand',v:f.brand},
    {ok:f.pledge==='None found',l:'No existing pledge on the cattle',v:f.pledge},
    {ok:(f.headVerified||0)>0,l:'Head verified in the field',v:f.headVerified?fmt(f.headVerified)+' head':''}
  ];
}
function collateral(f){return collChecks(f).filter(function(c){return c.ok;}).length;}
function completeness(f){var n=0;KEYS.forEach(function(k){if(filled(f[k]))n++;});return Math.round(n/KEYS.length*100);}
function dueState(f){
  if(!f.nextDate||!isActive(f))return '';
  var t=today();
  if(f.nextDate<t)return 'over';
  if(f.nextDate===t)return 'due';
  return '';
}
function waLink(phone){
  var p=String(phone||'').trim(); if(!p)return '';
  var d=digits(p); if(!d)return '';
  if(p.charAt(0)==='+'){/* as typed */}
  else if(d.indexOf('595')===0){/* has country code */}
  else if(d.charAt(0)==='0'){d='595'+d.slice(1);}
  else{d='595'+d;}
  return 'https://wa.me/'+d;
}
function opts(list,sel,blank){
  var h=blank!=null?'<option value="">'+esc(blank)+'</option>':'';
  list.forEach(function(x){var v=typeof x==='string'?x:x.k,l=typeof x==='string'?x:x.l;h+='<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(l)+'</option>';});
  return h;
}

/* ---------- storage ---------- */
function loadLocal(){try{farmers=JSON.parse(localStorage.getItem(LS)||'[]')||[];}catch(e){farmers=[];}}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(farmers));}catch(e){toast('Could not save in this browser');}}
function newId(){
  if(mode==='sync'&&db){try{return db.collection('farmers').doc().id;}catch(e){}}
  return 'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}
async function save(f){
  f.updated=Date.now();
  try{
    if(mode==='sync'){
      var d=clone(f);var id=d.id;delete d.id;
      await db.collection('farmers').doc(id).set(d);
    }else{
      var i=farmers.findIndex(function(x){return x.id===f.id;});
      if(i>=0)farmers[i]=f;else farmers.push(f);
      persistLocal();render();
    }
    return true;
  }catch(e){toast('Save failed'+(e&&e.code?' ('+e.code+')':''));return false;}
}
async function removeFarmer(id){
  try{
    if(mode==='sync'){await db.collection('farmers').doc(id).delete();}
    else{farmers=farmers.filter(function(x){return x.id!==id;});persistLocal();render();}
    return true;
  }catch(e){toast('Delete failed'+(e&&e.code?' ('+e.code+')':''));return false;}
}

function isMobile(){return !!(window.matchMedia&&window.matchMedia('(max-width:900px)').matches);}
function openRecord(id){
  var key=id||'__new';
  if(dirty&&pendingKey!==key){pendingKey=key;toast('Unsaved changes — click again to discard them');return;}
  pendingKey=null;
  var f=id?farmers.find(function(x){return x.id===id;}):null;
  if(id&&!f)return;
  editing=f?clone(f):{id:newId(),created:Date.now(),stage:'new',log:[]};
  isNew=!f;selectedId=f?f.id:null;dirty=false;delArmed=false;dupAck=null;msg('');
  fillForm(editing);
  if(isMobile())$('side').classList.add('open');
  render();
  if(!f&&!isMobile())$('f_name').focus();
}
function findDup(f,pool){
  pool=pool||farmers;
  var ids=[f.ci,f.ruc,f.companyRuc].map(digits).filter(function(x){return x.length>=5;});
  var ph=digits(f.phone);ph=ph.length>=9?ph.slice(-9):'';
  for(var i=0;i<pool.length;i++){
    var g=pool[i];if(g.id===f.id)continue;
    var gi=[g.ci,g.ruc,g.companyRuc].map(digits).filter(function(x){return x.length>=5;});
    if(ids.some(function(x){return gi.indexOf(x)>=0;}))return {id:g.id,name:g.name,why:'same ID / RUC'};
    var gp=digits(g.phone);gp=gp.length>=9?gp.slice(-9):'';
    if(ph&&gp&&ph===gp)return {id:g.id,name:g.name,why:'same phone'};
  }
  return null;
}
async function saveForm(next){
  if(readOnly)return false;
  var v=readForm();
  if(!v.name){msg('Name is required.');$('f_name').focus();return false;}
  var f=Object.assign({},editing,v,{log:(editing&&editing.log)||[]});
  var d=findDup(f);
  if(d&&dupAck!==d.id){dupAck=d.id;msg('Possible duplicate of \u201c'+d.name+'\u201d ('+d.why+'). Press Save again to save anyway.');return false;}
  var ok=await save(f);
  if(!ok)return false;
  editing=f;isNew=false;selectedId=f.id;dirty=false;dupAck=null;msg('');
  toast('Saved');
  if(next){openRecord(null);}else{updateHead();render();}
  return true;
}
async function addLog(){
  var t=$('l_t').value.trim();
  if(!t){toast('Write a short note first');return;}
  if(!$('f_name').value.trim()){msg('Add the farmer\u2019s name before logging contact.');$('f_name').focus();return;}
  editing.log=editing.log||[];
  editing.log.push({d:today(),ch:$('l_ch').value,t:t});
  $('l_t').value='';
  if($('f_stage').value==='new')$('f_stage').value='contacted';
  renderLog();
  await saveForm(false);
}

function filtered(){
  var q=$('q').value.trim().toLowerCase(),st=$('fStage').value,dp=$('fDept').value,sr=$('fSource').value;
  return farmers.filter(function(f){
    if(st&&f.stage!==st)return false;
    if(dp&&f.dept!==dp)return false;
    if(sr&&f.source!==sr)return false;
    if(q){
      var h=[f.name,f.ci,f.ruc,f.company,f.companyRuc,f.farm,f.district,f.dept,f.phone,f.email,f.notes,f.nextAction,f.history].join(' ').toLowerCase();
      if(h.indexOf(q)<0)return false;
    }
    return true;
  }).sort(function(a,b){return (b.updated||0)-(a.updated||0);});
}
function renderStats(){
  var act=farmers.filter(isActive);
  var contacted=farmers.filter(function(f){return f.stage!=='new';}).length;
  var head=act.reduce(function(s,f){return s+(f.herd||0);},0);
  var need=act.reduce(function(s,f){return s+(f.need||0);},0);
  var late=farmers.filter(function(f){var d=dueState(f);return d==='over'||d==='due';}).length;
  var closed=farmers.filter(function(f){return f.stage==='closed';}).length;
  var avg=farmers.length?Math.round(farmers.reduce(function(s,f){return s+completeness(f);},0)/farmers.length):0;
  var ready=farmers.filter(function(f){return collateral(f)===COLL_TOTAL;}).length;
  var items=[[farmers.length,'Total leads'],[contacted,'Contacted'],[act.length,'Active'],[fmt(head),'Head (active)'],['$'+fmt(need),'Est. need (active)'],[late,'Follow-ups due'],[closed,'Closed'],[avg+'%','Avg. profile complete'],[ready,'Collateral verified (5/5)']];
  $('stats').innerHTML=items.map(function(i){return '<div class="stat"><b>'+esc(i[0])+'</b><span>'+esc(i[1])+'</span></div>';}).join('');
}

function renderFollow(list){
  var t=today(),d7=new Date(Date.now()+7*864e5);
  d7=new Date(d7.getTime()-d7.getTimezoneOffset()*60000).toISOString().slice(0,10);
  var act=list.filter(isActive);
  function by(a,b){return (a.nextDate||'').localeCompare(b.nextDate||'');}
  var due=act.filter(function(f){return f.nextDate&&f.nextDate<=t;}).sort(by);
  var soon=act.filter(function(f){return f.nextDate&&f.nextDate>t&&f.nextDate<=d7;}).sort(by);
  var none=act.filter(function(f){return !f.nextDate;});
  function sec(title,items,empty){return '<div class="sec"><h2>'+esc(title)+' ('+items.length+')</h2><div class="list">'+(items.length?items.map(cardHtml).join(''):'<div class="muted small">'+esc(empty)+'</div>')+'</div></div>';}
  return sec('Overdue / due today',due,'Nothing due.')+sec('Next 7 days',soon,'Nothing scheduled.')+sec('Active leads with no next step',none,'Every active lead has a next step.');
}
function emptyHtml(){return '<div class="empty">'+(farmers.length?'No leads match these filters.':'No leads yet. Fill in the form on the left and press Save.')+'</div>';}
function render(){
  renderStats();
  if(page==='profile')renderProfile();
  if(page==='dash')renderDash();
  var list=filtered(),h;
  if(mode==='pending')h='<div class="empty">Loading…</div>';
  else if(!farmers.length)h=emptyHtml();
  else if(view==='board')h=renderBoard(list);
  else if(view==='list')h=renderList(list);
  else h=renderFollow(list);
  $('content').innerHTML=h;
  var b=$('modeBadge');
  if(mode==='sync'){b.textContent=readOnly?'Synced · read-only':'Synced';b.className='badge';}
  else if(mode==='local'){b.textContent='Local only (this browser)';b.className='badge warn';}
  else{b.textContent='Loading…';b.className='badge';}
}
async function move(id,dir){
  if(readOnly)return;
  var f=farmers.find(function(x){return x.id===id;});if(!f)return;
  var i=STAGES.findIndex(function(s){return s.k===f.stage;}),n=i+dir;
  if(n<0||n>=STAGES.length)return;
  await save(Object.assign({},f,{stage:STAGES[n].k}));
  if(selectedId===id&&!dirty){editing=clone(farmers.find(function(x){return x.id===id;})||editing);fillForm(editing);}
}

/* ---------- export ---------- */
async function exportCsv(){
  var fields=[];SECTIONS.forEach(function(s){s.f.forEach(function(x){fields.push(x);});});
  function q(v){v=String(v==null?'':v);return '"'+v.replace(/"/g,'""')+'"';}
  var head=fields.map(function(x){return x.l.replace(' *','');}).concat(['Last contact','Contacts logged','Profile complete %','Created']);
  var rows=[head.map(q).join(',')];
  farmers.slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'');}).forEach(function(f){
    var r=fields.map(function(x){return x.k==='stage'?stageLabel(f.stage):f[x.k];});
    r=r.concat([lastContact(f),(f.log||[]).length,completeness(f),f.created?new Date(f.created).toISOString().slice(0,10):'']);
    rows.push(r.map(q).join(','));
  });
  try{await saveFile('cattle-leads-'+today()+'.csv','\ufeff'+rows.join('\r\n'));}
  catch(e){if(!e||e.code!=='declined')toast('Export failed');}
}

function b64bytes(b){var t=atob(b),u=new Uint8Array(t.length);for(var i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u;}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function saveFile(name,data){
  if(dl){await dl.save({filename:name,data:data});return;}
  var blob=new Blob([data]),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
}
async function downloadTemplate(){
  try{await saveFile('cattle-leads-import-template.xlsx',b64bytes(TEMPLATE_B64));}
  catch(e){if(!e||e.code!=='declined')toast('Download failed');}
}
function plain(s){return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s*\*\s*$/,'').replace(/[^a-z0-9]+/g,' ').trim();}
var ALL_FIELDS=[];SECTIONS.forEach(function(s){s.f.forEach(function(x){ALL_FIELDS.push(x);});});
function headerMap(row){
  var map={},n=0;
  row.forEach(function(h,i){
    var p=plain(h);if(!p)return;
    if(p==='contact log optional'||p==='contact log'||p==='log'){map[i]='log';n++;return;}
    for(var j=0;j<ALL_FIELDS.length;j++){var x=ALL_FIELDS[j];if(p===plain(x.l)||p===plain(x.k)){map[i]=x;n++;return;}}
  });
  return {map:map,n:n};
}
function pad(n){return (n<10?'0':'')+n;}
function parseDate(v){
  if(v===''||v==null)return '';
  if(typeof v==='number'){var c=XLSX.SSF.parse_date_code(v);return c?c.y+'-'+pad(c.m)+'-'+pad(c.d):null;}
  if(v instanceof Date)return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  var s=String(v).trim(),m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/)))return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  return null;
}
function matchOpt(x,val){
  var p=plain(val);
  for(var i=0;i<x.o.length;i++){
    var o=x.o[i],v=typeof o==='string'?o:o.k,l=typeof o==='string'?o:o.l;
    if(plain(v)===p||plain(l)===p)return v;
  }
  return null;
}
function parseLog(v,warns,rowNo){
  var out=[];
  String(v).split(/\r?\n/).forEach(function(line){
    line=line.trim();if(!line)return;
    var p=line.split('|').map(function(x){return x.trim();});
    if(p.length>=3){
      var d=parseDate(p[0]);
      var ch=CHANNELS.filter(function(c){return plain(c)===plain(p[1]);})[0]||'Other';
      if(d===null||d==='')warns.push('Row '+rowNo+': contact-log date “'+p[0]+'” not understood — used today');
      out.push({d:d||today(),ch:ch,t:p.slice(2).join(' | ')});
    }else if(p.length===2&&parseDate(p[0])){
      out.push({d:parseDate(p[0]),ch:'Other',t:p[1]});
    }else out.push({d:today(),ch:'Other',t:line});
  });
  return out;
}
function convertRow(row,map,rowNo){
  var rec={id:null,created:Date.now(),stage:'new',log:[]},warns=[],extra=[];
  Object.keys(map).forEach(function(ci){
    var x=map[ci],v=row[ci];
    if(v==null||String(v).trim()==='')return;
    if(x==='log'){rec.log=parseLog(v,warns,rowNo);return;}
    var t=x.t||'text';
    if(t==='select'){
      var m=matchOpt(x,v);
      if(m==null){warns.push('Row '+rowNo+': '+x.l.replace(' *','')+' “'+v+'” not recognized — left blank, kept in Notes');extra.push(x.l.replace(' *','')+': '+v);}
      else rec[x.k]=m;
    }else if(t==='num'){
      var n=typeof v==='number'?v:parseFloat(String(v).replace(/[^\d.\-]/g,''));
      if(isFinite(n))rec[x.k]=n;
      else{warns.push('Row '+rowNo+': '+x.l+' “'+v+'” is not a number — kept in Notes');extra.push(x.l+': '+v);}
    }else if(t==='date'){
      var d=parseDate(v);

  return {rec:rec,warns:warns};
}

function previewImport(name,buf){
  var wb=XLSX.read(buf,{type:'array'});
  var sn=wb.SheetNames.indexOf('Leads')>=0?'Leads':wb.SheetNames[0];
  var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
  var hi=-1,hm=null;
  for(var i=0;i<Math.min(rows.length,10);i++){var m=headerMap(rows[i]);if(m.n>=2&&(hm==null||m.n>hm.n)){hm=m;hi=i;}}
  if(hi<0)return showImpError('No recognizable header row found in sheet “'+sn+'”. Use the template’s header names.');
  var hasName=Object.keys(hm.map).some(function(k){return hm.map[k]!=='log'&&hm.map[k].k==='name';});
  if(!hasName)return showImpError('The sheet has no “Full name” column. Use the template’s header names.');
  var items=[],accepted=[],skippedNoName=0,examples=0,issues=[];
  for(var r=hi+1;r<rows.length;r++){
    var row=rows[r];
    if(!row.some(function(c){return String(c).trim()!=='';}))continue;
    var rowNo=r+1,nameCol=Object.keys(hm.map).filter(function(k){return hm.map[k]!=='log'&&hm.map[k].k==='name';})[0];
    var nm=String(row[nameCol]==null?'':row[nameCol]).trim();
    if(/^example\b/i.test(nm)){examples++;continue;}
    if(!nm){skippedNoName++;issues.push('Row '+rowNo+': no name — skipped');continue;}
    var cv=convertRow(row,hm.map,rowNo);
    cv.rec.id='imp'+rowNo;
    cv.warns.forEach(function(w){issues.push(w);});
    var dup=findDup(cv.rec,farmers.concat(accepted));
    var it={rowNo:rowNo,rec:cv.rec,status:dup?'dup':'ok',why:dup?('possible duplicate of “'+dup.name+'” ('+dup.why+')'):''};
    if(dup)issues.push('Row '+rowNo+': '+it.rec.name+' — '+it.why);
    else accepted.push(cv.rec);
    items.push(it);
  }
  imp={file:name,sheet:sn,items:items};
  var ok=items.filter(function(x){return x.status==='ok';}).length,dups=items.length-ok;
  var h='<div class="impbox"><h2>Import preview</h2><div class="muted small">'+esc(name)+' · sheet “'+esc(sn)+'”</div><div class="impsum">'+
    '<span class="good">'+ok+' ready</span>'+(dups?'<span class="meh">'+dups+' possible duplicates</span>':'')+
    (skippedNoName?'<span class="bad">'+skippedNoName+' skipped (no name)</span>':'')+(examples?'<span>'+examples+' example row ignored</span>':'')+'</div>';
  if(dups)h+='<label style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text)"><input type="checkbox" id="impDup" style="width:auto"> Import the possible duplicates too</label>';
  if(issues.length)h+='<div class="issues">'+issues.slice(0,40).map(function(x){return '<div>'+esc(x)+'</div>';}).join('')+(issues.length>40?'<div class="muted">…and '+(issues.length-40)+' more</div>':'')+'</div>';
  if(items.length){
    h+='<div class="tablewrap"><table><thead><tr><th>Row</th><th>Name</th><th>Company</th><th>Farm / place</th><th>Head</th><th>Status</th></tr></thead><tbody>'+
      items.slice(0,12).map(function(it){var f=it.rec;return '<tr><td>'+it.rowNo+'</td><td>'+esc(f.name)+'</td><td>'+esc(f.company||'')+'</td><td>'+esc([f.farm,f.district,f.dept].filter(Boolean).join(' · '))+'</td><td>'+(f.herd?fmt(f.herd):'')+'</td><td>'+(it.status==='ok'?'<span class="over" style="color:var(--ok)">Ready</span>':'<span class="due">Duplicate?</span>')+'</td></tr>';}).join('')+
      '</tbody></table></div>'+(items.length>12?'<div class="muted small" style="margin-top:4px">Showing the first 12 of '+items.length+' rows.</div>':'');
  }else h+='<div class="empty">No importable rows found.</div>';
  h+='<div id="impProg" class="muted small" style="margin-top:8px"></div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="primary" id="impGo"'+(ok?'':' disabled')+'>Import '+ok+' lead'+(ok===1?'':'s')+'</button><button id="impCancel">Cancel</button></div></div>';
  $('imp').innerHTML=h;$('imp').hidden=false;
}
function impCount(){
  if(!imp)return 0;

  return imp.items.filter(function(x){return x.status==='ok'||(inc&&x.status==='dup');}).length;
}
async function doImport(){
  var inc=$('impDup')&&$('impDup').checked;
  var list=imp.items.filter(function(x){return x.status==='ok'||(inc&&x.status==='dup');});
  if(!list.length)return;
  $('impGo').disabled=true;$('impCancel').disabled=true;
  var done=0,fail=0;
  if(mode==='sync'){
    for(var i=0;i<list.length;i++){
      var f=list[i].rec;f.id=newId();f.updated=Date.now();
      var d=clone(f);delete d.id;var okk=false;
      for(var t=0;t<2&&!okk;t++){
        try{await db.collection('farmers').doc(f.id).set(d);okk=true;}
        catch(e){if(e&&(e.code==='resource_exhausted'||e.code==='unavailable'))await sleep(1500);else break;}
      }
      if(okk)done++;else fail++;
      $('impProg').textContent='Importing '+(i+1)+' / '+list.length+'…';
      await sleep(40);
    }
  }else{
    list.forEach(function(it){var f=it.rec;f.id=newId();f.updated=Date.now();farmers.push(f);done++;});
    persistLocal();
  }
  closeImp();render();
  toast('Imported '+done+(fail?' · '+fail+' failed':''));
}

function attention(act){
  var out=[];
  act.forEach(function(f){
    var why=[],ds=dueState(f),lc=lastContact(f),dsl=daysSince(lc);
    if(ds==='over')why.push(['r','Follow-up overdue']);
    else if(ds==='due')why.push(['w','Follow-up due today']);
    if(!f.nextDate)why.push(['w','No next step']);
    if(!lc)why.push(['w',f.stage==='new'?'Not contacted yet':'No contact logged']);
    else if(dsl>14)why.push(['w','No contact in '+dsl+' days']);
    if((f.stage==='verifying'||f.stage==='offer')&&collateral(f)<COLL_TOTAL)why.push(['r','Collateral '+collateral(f)+'/'+COLL_TOTAL+' at '+stageLabel(f.stage)]);
    if(why.length)out.push({f:f,why:why});
  });
  out.sort(function(a,b){return b.why.length-a.why.length||String(a.f.name).localeCompare(String(b.f.name));});
  return out;
}
function renderDash(){
  var el=$('dash'),all=farmers,act=all.filter(isActive),t=today();
  var h='<div class="pf-top"><h2 class="serif" style="margin:0;font-size:22px">Dashboard</h2><span class="muted small">As of '+esc(t)+' · “Active” means not closed or lost</span></div>';
  if(mode==='pending'){el.innerHTML=h+'<div class="empty">Loading…</div>';return;}
  if(!all.length){
    el.innerHTML=h+'<div class="empty"><p style="margin:0 0 12px">No leads yet. The charts will appear as soon as you add farmers.</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="primary" data-dact="add">+ Add first farmer</button><button data-dact="import">Import Excel</button><button data-dact="tpl">Download Excel template</button></div></div>';
    return;
  }
  var closed=all.filter(function(f){return f.stage==='closed';}).length,lost=all.filter(function(f){return f.stage==='lost';}).length;
  var contacted=all.filter(function(f){return f.stage!=='new';}).length;
  var head=sum(act,'herd'),need=sum(act,'need'),vh=sum(act,'headVerified');
  var ready=act.filter(function(f){return collateral(f)===COLL_TOTAL;}).length;
  var due=act.filter(function(f){var d=dueState(f);return d==='over'||d==='due';}).length;
  var days=act.map(function(f){return daysSince(lastContact(f));}).filter(function(d){return d!=null;});
  var avgDays=days.length?Math.round(days.reduce(function(a,b){return a+b;},0)/days.length):null;
  var tiles=[
    [all.length,'Total leads'],[act.length,'Active leads'],[pctOf(contacted,all.length)+'%','Contacted ('+contacted+' of '+all.length+')'],
    [(closed+lost)?pctOf(closed,closed+lost)+'%':'—','Win rate (closed ÷ closed + lost)'],[fmt(head),'Head of cattle (active)'],['$'+fmt(need),'Financing need (active)'],
    [ready+' / '+act.length,'Collateral 5/5 (active)'],[(head?pctOf(vh,head):0)+'%','Herd verified in the field'],[due,'Follow-ups due or overdue'],[avgDays==null?'—':avgDays,'Avg days since last contact']
  ];
  h+='<div class="tiles" style="margin-top:12px">'+tiles.map(function(x){return '<div class="tile"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>';}).join('')+'</div>';

  // 1 pipeline by stage
  var st1=STAGES.map(function(s){var L=all.filter(function(f){return f.stage===s.k;});return {label:s.l,value:L.length,cls:'st-'+s.k,attr:'data-gostage="'+s.k+'"',text:L.length+(sum(L,'need')?' · '+usd(sum(L,'need')):'')};});
  // 2 need by stage
  var st2=STAGES.map(function(s){var n=sum(all.filter(function(f){return f.stage===s.k;}),'need');return {label:s.l,value:n,cls:'st-'+s.k,attr:'data-gostage="'+s.k+'"',text:usd(n)};}).filter(function(r){return r.value>0;});
  // 3 head by department (active)
  var gd=groupBy(act,function(f){return f.dept||'No department';});
  var dep=gd.order.map(function(k){var L=gd.m[k];return {label:k,value:sum(L,'herd'),attr:k==='No department'?'':'data-godept="'+esc(k)+'"',text:fmt(sum(L,'herd'))+' head · '+L.length+' lead'+(L.length===1?'':'s')};}).sort(function(a,b){return b.value-a.value;}).slice(0,8);
  // 4 operation type donut
  var gc=groupBy(act,function(f){return f.cat||'Unknown';});
  var cats=gc.order.map(function(k){return {label:k,value:gc.m[k].length};});
  // 5 source donut
  var gs=groupBy(all,function(f){return f.source||'Not set';});
  var srcs=gs.order.map(function(k){return {label:k,value:gs.m[k].length,attr:k==='Not set'?'':'data-gosource="'+esc(k)+'"'};});
  // 6 collateral histogram (active)
  var coll=[];for(var i=0;i<=COLL_TOTAL;i++)coll.push({label:i+'/'+COLL_TOTAL,value:act.filter(function(f){return collateral(f)===i;}).length});
  // 7 completeness histogram (all)
  var bk=[['0–25%',0,25],['26–50%',26,50],['51–75%',51,75],['76–100%',76,100]].map(function(b){return {label:b[0],value:all.filter(function(f){var c=completeness(f);return c>=b[1]&&c<=b[2];}).length};});
  // 8 credit history donut
  var gh=groupBy(all,function(f){return f.creditHistory||'Unknown';});
  var cred=gh.order.map(function(k){return {label:k,value:gh.m[k].length};});
  // 9 contacts per week
  var wk=weekBuckets(8);all.forEach(function(f){(f.log||[]).forEach(function(e){wk.forEach(function(b){if(e.d>=b.s&&e.d<b.e)b.value++;});});});
  // 10 interest mix (active)
  var interest=['Loan','Buy cattle','Both','Undecided'].map(function(k){var L=act.filter(function(f){return (f.interest||'Undecided')===k;});return {label:k,value:L.length,text:L.length+(sum(L,'need')?' · '+usd(sum(L,'need')):'')};});
  // 11 attention
  var att=attention(act),attHtml=att.length?att.slice(0,8).map(function(a){return '<div class="att" data-open="'+esc(a.f.id)+'"><div><strong>'+esc(a.f.name)+'</strong><div class="muted small">'+esc(stageLabel(a.f.stage))+(a.f.nextAction?' · '+esc(a.f.nextAction):'')+'</div></div><div class="why">'+a.why.map(function(w){return '<span class="chip '+w[0]+'">'+esc(w[1])+'</span>';}).join('')+'</div></div>';}).join('')+(att.length>8?'<div class="muted small" style="margin-top:6px">…and '+(att.length-8)+' more</div>':''):'<div class="muted small">Nothing needs attention right now.</div>';
  // 12 top opportunities
  var top=act.slice().sort(function(a,b){return (b.need||0)-(a.need||0);}).slice(0,6);
  var topHtml=top.length?'<div class="tablewrap" style="box-shadow:none;border:none"><table class="dtable"><thead><tr><th>Owner</th><th>Stage</th><th>Need</th><th>Head</th><th>Collateral</th><th>Next action</th></tr></thead><tbody>'+top.map(function(f){var ds=dueState(f);return '<tr data-open="'+esc(f.id)+'"><td><strong>'+esc(f.name)+'</strong><div class="muted small">'+esc([f.farm,f.dept].filter(Boolean).join(' · '))+'</div></td><td class="st-'+esc(f.stage)+'"><span class="dot"></span>'+esc(stageLabel(f.stage))+'</td><td>'+(f.need?'$'+fmt(f.need):'—')+'</td><td>'+(f.herd?fmt(f.herd):'—')+'</td><td>'+collateral(f)+'/'+COLL_TOTAL+'</td><td class="'+(ds==='over'?'over':ds==='due'?'due':'')+'">'+esc(f.nextAction||'—')+(f.nextDate?'<div class="small">'+esc(f.nextDate)+'</div>':'')+'</td></tr>';}).join('')+'</tbody></table></div>':'<div class="muted small">No active leads.</div>';

  h+='<div class="dgrid">'+
    dcard('Pipeline by stage','all leads · count · need','<div>'+hbars(st1)+'</div>','s2')+
    dcard('Financing need by stage','USD, all leads',hbars(st2))+
    dcard('Head of cattle by department','active leads · top 8',hbars(dep),'s2')+
    dcard('Operation type','active leads',donut(cats))+
    dcard('Lead source','all leads · click to filter',donut(srcs))+
    dcard('Collateral readiness','active leads · checks passed',vcols(coll))+
    dcard('Profile completeness','all leads',vcols(bk))+
    dcard('Credit history','all leads',donut(cred))+
    dcard('Contacts logged per week','last 8 weeks (week starting)',vcols(wk),'s2')+
    dcard('Interest mix','active leads · count · need',hbars(interest))+
    dcard('Needs attention','overdue, no next step, no contact in 14+ days, collateral gaps',attHtml,'s2')+
    dcard('Top opportunities','active leads by financing need',topHtml,'s3')+
  '</div>';
  el.innerHTML=h;
}
function goPipeline(f){
  $('q').value='';$('fStage').value=f.stage||'';$('fDept').value=f.dept||'';$('fSource').value=f.source||'';
  setPage('pipeline');render();window.scrollTo(0,0);
}
$('dash').addEventListener('click',function(e){
  var a=e.target.closest('[data-open],[data-gostage],[data-godept],[data-gosource],[data-dact]');if(!a)return;
  var d=a.dataset;
  if(d.open){openProfile(d.open);return;}
  if(d.dact==='add'){setPage('pipeline');openRecord(null);render();return;}
  if(d.dact==='import'){pickFile();return;}
  if(d.dact==='tpl'){downloadTemplate();return;}
  if(d.gostage)goPipeline({stage:d.gostage});
  else if(d.godept)goPipeline({dept:d.godept});
  else if(d.gosource)goPipeline({source:d.gosource});
});
$('navTabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-nav]');if(!b)return;
  setPage(b.dataset.nav);render();window.scrollTo(0,0);
});
$('fClear').addEventListener('click',function(){$('q').value='';$('fStage').value='';$('fDept').value='';$('fSource').value='';render();});

/* ---------- events ---------- */
function setupFilters(){
  $('fStage').innerHTML=opts(STAGES,'','All stages');
  $('fDept').innerHTML=opts(DEPTS,'','All departments');
  $('fSource').innerHTML=opts(SOURCES,'','All sources');
  ['q','fStage','fDept','fSource'].forEach(function(id){$(id).addEventListener('input',render);});
}
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-view]');if(!b)return;
  view=b.dataset.view;
  Array.prototype.forEach.call($('tabs').children,function(x){x.className=x===b?'on':'';});
  render();
});
$('content').addEventListener('click',function(e){
  var mv=e.target.closest('[data-move]');
  if(mv){e.stopPropagation();move(mv.dataset.move,parseInt(mv.dataset.dir,10));return;}
  if(e.target.closest('a'))return;
  var op=e.target.closest('[data-open]');
  if(op)openProfile(op.dataset.open);
});
$('btnAdd').addEventListener('click',function(){setPage('pipeline');openRecord(null);});
$('btnExport').addEventListener('click',exportCsv);
$('btnTpl').addEventListener('click',downloadTemplate);
$('btnImp').addEventListener('click',pickFile);
$('impFile').addEventListener('change',function(){
  var f=this.files&&this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){try{previewImport(f.name,r.result);}catch(e){console.error(e);showImpError('Could not read that file. Make sure it is an .xlsx, .xls or .csv.');}};
  r.onerror=function(){showImpError('Could not read that file.');};
  r.readAsArrayBuffer(f);
});
$('imp').addEventListener('click',function(e){
  var id=e.target.id;
  if(id==='impCancel'||e.target===$('imp')){if(!$('impCancel')||!$('impCancel').disabled)closeImp();}
  else if(id==='impGo')doImport();
});
$('imp').addEventListener('change',function(e){
  if(e.target.id==='impDup'){var n=impCount();$('impGo').textContent='Import '+n+' lead'+(n===1?'':'s');$('impGo').disabled=!n;}
});
$('btnSave').addEventListener('click',function(){saveForm(false);});
$('btnSaveNew').addEventListener('click',function(){saveForm(true);});
$('btnDel').addEventListener('click',function(){
  if(isNew||readOnly)return;
  if(!delArmed){delArmed=true;$('btnDel').textContent='Click again to delete';return;}
  var id=editing.id;
  removeFarmer(id).then(function(ok){if(ok){dirty=false;toast('Deleted');openRecord(null);}});
});
$('sideClose').addEventListener('click',function(){$('side').classList.remove('open');});
$('formBody').addEventListener('input',function(e){
  if(e.target.id==='l_t')return;
  dirty=true;dupAck=null;pendingKey=null;updateHead();
});
$('formBody').addEventListener('change',function(e){
  if(e.target.id==='l_ch')return;
  dirty=true;updateHead();
});
$('formBody').addEventListener('click',function(e){if(e.target.id==='l_add')addLog();});
$('formBody').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='l_t'){e.preventDefault();addLog();}});

/* ---------- init ---------- */
async function init(){
  buildForm();
  setPage('dash');
  setupFilters();
  editing={id:newId(),created:Date.now(),stage:'new',log:[]};
  fillForm(editing);
  render();
  var user=null;
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      db=await window.claude.use('db');
      dl=await window.claude.use('downloads');
      user=await window.claude.use('user');
    }
  }catch(e){db=null;}
  if(dl)$('btnExport').hidden=false;
  if(db){
    mode='sync';
    try{if(user&&typeof user.can==='function'){var c=await user.can('data.write');if(c===false)readOnly=true;}}catch(e){}
    try{
      db.collection('farmers').onSnapshot(function(snap){
        farmers=snap.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o;});
        render();
      },function(err){toast('Live sync lost'+(err&&err.code?' ('+err.code+')':''));});
    }catch(e){mode='local';loadLocal();}
    editing.id=newId();
  }else{
    mode='local';loadLocal();
  }
  updateHead();
  render();
}
init();
})();
</script>
